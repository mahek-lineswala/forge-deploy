# Static deployment server for local development.
#   docker compose -f infra/docker-compose.yml up -d
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: forgedeploy-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # local machine only, not your LAN
    volumes:
      - ../deployment-worker/deployments:/srv/deployments:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
