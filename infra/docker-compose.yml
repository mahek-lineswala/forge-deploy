# Local infrastructure: Redis (queue) + Nginx (static deployments).
#   docker compose -f infra/docker-compose.yml up -d     start
#   docker compose -f infra/docker-compose.yml stop      stop
services:
  redis:
    image: redis:7-alpine
    container_name: forgedeploy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # queue survives restarts
    ports:
      - "127.0.0.1:6379:6379"   # local machine only
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:1.27-alpine
    container_name: forgedeploy-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # local machine only, not your LAN
    volumes:
      - ../deployment-worker/deployments:/srv/deployments:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  redis-data:
