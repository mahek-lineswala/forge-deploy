# Local development infrastructure: Redis (job queue) + Nginx (serves deployments).
# Backend and worker run on the host with `npm run dev` / `npm start`.
#
#   docker compose -f infra/docker-compose.yml up -d     start
#   docker compose -f infra/docker-compose.yml stop      stop
#
# Deployments: http://<deploymentId>.localhost:8080
# Ports bind to 127.0.0.1 only. Runtime containers join "forgedeploy-network" so Nginx can reach them.
# Production uses infra/docker-compose.prod.yml instead (see infra/README.md).

services:
  redis:
    image: redis:7-alpine
    container_name: forgedeploy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - forgedeploy-network

  nginx:
    image: nginx:1.27-alpine
    container_name: forgedeploy-nginx
    restart: unless-stopped
    environment:
      DEPLOYMENT_DOMAIN: localhost
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates/dev:/etc/nginx/templates:ro
      - ../deployment-worker/deployments:/srv/deployments:ro
      - ../deployment-worker/runtime-nginx:/etc/nginx/runtime:ro
    networks:
      - forgedeploy-network

volumes:
  redis-data:

networks:
  forgedeploy-network:
    name: forgedeploy-network
    driver: bridge
