# ForgeDeploy Nginx (shared by development and production).
#
#   Deployment URL:  <24-hex deploymentId>.<DEPLOYMENT_DOMAIN>
#   Static:          files from /srv/deployments/<id>
#   Runtime:         proxied to the container listed in /etc/nginx/runtime/<id>.map
#
# Environment-specific server blocks live in templates/{dev,prod}/ and are rendered
# into /etc/nginx/conf.d by the official image's envsubst step at startup.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  server_tokens     off;
  autoindex         off;
  disable_symlinks  on;
  client_max_body_size 10m;

  log_format forgedeploy '$host $remote_addr "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log forgedeploy;

  # Docker's embedded DNS: runtime containers are resolved by name per request,
  # so a removed container only breaks its own site (502), never a reload.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Scheme the visitor used: Cloudflare Tunnel (and any TLS proxy in front) reports it in
  # X-Forwarded-Proto; otherwise Nginx's own scheme applies.
  map $http_x_forwarded_proto $forgedeploy_proto {
    default $scheme;
    "https" https;
  }

  map $http_upgrade $forgedeploy_connection_upgrade {
    default upgrade;
    ""      close;
  }

  # "<id>.<domain>" -> "<id>"; anything else -> "" (404).
  map $host $deployment_id {
    "~^(?<id>[a-f0-9]{24})\." $id;
    default                   "";
  }

  # Runtime deployments: one "<id> <container>:<port>;" line per file, written by the worker.
  map $deployment_id $runtime_upstream {
    default "";
    include /etc/nginx/runtime/*.map;
  }

  include /etc/nginx/conf.d/*.conf;
}
