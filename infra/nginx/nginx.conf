# ForgeDeploy Nginx.
#   Static:  http://<24-hex id>.localhost:8080 -> /srv/deployments/<id>
#   Runtime: http://<24-hex id>.localhost:8080 -> container (routes in /etc/nginx/runtime/<id>.conf)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  server_tokens     off;
  autoindex         off;
  disable_symlinks  on;

  log_format forgedeploy '$host $remote_addr "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log forgedeploy;

  # Runtime deployments: one <deploymentId>.conf per site, written by the worker.
  # Upstreams are resolved per request via Docker's DNS, so a removed container
  # only breaks its own site (502), never `nginx -t` or reloads.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $forgedeploy_connection_upgrade {
    default upgrade;
    ""      close;
  }

  include /etc/nginx/runtime/*.conf;

  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }

  # Static deployments.
  server {
    listen 80;
    server_name "~^(?<deployment_id>[a-f0-9]{24})\.localhost$";

    root  /srv/deployments/$deployment_id;
    index index.html;

    location ~ /\. {
      return 404;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      try_files $uri $uri/ /index.html =404;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
    }
  }
}
