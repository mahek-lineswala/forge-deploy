# ForgeDeploy static deployment server.
# Each deployment is served on its own subdomain:
#   http://<24-hex deploymentId>.localhost:8080  ->  /srv/deployments/<deploymentId>
# Browsers resolve *.localhost to 127.0.0.1 automatically.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  server_tokens     off;
  autoindex         off;
  disable_symlinks  on;   # build output is symlink-free; refuse to follow any

  log_format forgedeploy '$host $remote_addr "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log forgedeploy;

  # ------------------------------------------------------------
  # Platform host (localhost:8080) and any unknown Host header
  # ------------------------------------------------------------
  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }

  # ------------------------------------------------------------
  # Deployments: only a strict 24-char lowercase hex ID is accepted,
  # so the root path cannot be influenced beyond one directory.
  # ------------------------------------------------------------
  server {
    listen 80;
    server_name "~^(?<deployment_id>[a-f0-9]{24})\.localhost$";

    root  /srv/deployments/$deployment_id;
    index index.html;

    # Never serve dotfiles (.git, .env, ...)
    location ~ /\. {
      return 404;
    }

    # Hashed Vite/CRA assets: immutable, and never fall back to index.html
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: unknown paths render index.html
    location / {
      try_files $uri $uri/ /index.html =404;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
    }
  }
}
