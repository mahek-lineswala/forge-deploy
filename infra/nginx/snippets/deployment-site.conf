# Serves one deployment, selected by $deployment_id (see nginx.conf).
# Static deployments are served from disk; runtime deployments are proxied.
# Included by every server block that serves deployments.

if ($deployment_id = "") {
  return 404;
}

root  /srv/deployments/$deployment_id;
index index.html;

# Runtime deployments jump to @runtime from every location below.
error_page 418 = @runtime;

location ~ /\. {
  if ($runtime_upstream) { return 418; }
  return 404;
}

location /assets/ {
  if ($runtime_upstream) { return 418; }

  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options "nosniff" always;
}

location / {
  if ($runtime_upstream) { return 418; }

  # SPA fallback: unknown paths render index.html.
  try_files $uri $uri/ /index.html =404;
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}

location @runtime {
  proxy_pass http://$runtime_upstream;
  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forgedeploy_proto;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $forgedeploy_connection_upgrade;

  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
}
